[project]
name = "paging-mcp"
version = "0.1.0"
description = "FastMCP server that pages on-call via 100+ notification channels (Apprise wrapper)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0,<4.0",
    "apprise>=1.9,<2.0",
]
license = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
